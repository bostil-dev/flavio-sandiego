    fact:'Israel fica no Oriente Médio! Jerusalém é sagrada para 3 religiões. Muito tecnológico, conhecida como "Startup Nation". Tem forte vínculo político com o Brasil!',
    areas:[{id:'tla',   name:'Tel Aviv Beachfront', icon:'🏖️',witness:'David, taxista'},
           {id:'jer',   name:'Cidade Velha',         icon:'🕌',witness:'Yael, guia'},
           {id:'knes',  name:'Knesset (Parlamento)', icon:'🏛️',witness:'Ehud, deputado'}]},

           {id:'vol',   name:'Vulcão Santa Ana',  icon:'🌋',witness:'Miguel, guia'},
           {id:'pup',   name:'Pupuseria Amalia',  icon:'🫓',witness:'Amalia, cozinheira'}]},

    fact:'Abu Dhabi é a capital dos Emirados Árabes! Tem a belíssima Mesquita Sheikh Zayed e é um dos maiores produtores de petróleo do mundo. Riqueza sem fim!',
    areas:[{id:'mosq',  name:'Mesquita Sheikh Zayed', icon:'🕌',witness:'Abdullah, imam'},
           {id:'pal',   name:'Palácio Presidencial',  icon:'👑',witness:'Khalid, guarda'},
           {id:'oil',   name:'ADNOC (Petróleo)',       icon:'🛢️',witness:'Yasir, engenheiro'}]}

const DEST_CLUES = {
  brasilia:     ['Alguém viu ele lendo um processo judicial tentando rasgar!','Foi visto pedindo pastel no aeroporto JK, nervoso!','Perguntou onde ficava "o supremo tribunal"... de óculos escuros!'],
  riodejaneiro: ['Comprou havaianas e protetor solar FPS 100!','Perguntou por "uma praia famosa perto de uma estátua enorme"!','Foi visto numa van com adesivo do Flamengo, com uma canga listrada!'],
  buenosaires:  ['Estava com dicionário de espanhol portenho e pedia "asado"!','Perguntou sobre extradição com "o país do tango"!','Comprou pesos argentinos em casa de câmbio bem nervoso!'],
  washingtondc: ['Tinha foto ao lado de Trump como fundo de tela do celular!','Perguntou onde fica "a casa do presidente americano" sem usar Google!','Tentava falar inglês americano com sotaque carregado!'],
  dubai:        ['Perguntou sobre "países sem imposto de renda no Oriente Médio"!','Levava guia de "Países Sem Acordo de Extradição" aberto!','Foi visto pesquisando preços de apartamento em Dubai!'],
  israel:       ['Comprou um kippah e estava com guia de Jerusalém!','Perguntou se Israel tinha acordo de extradição com o Brasil...','Foi visto conversando com o embaixador israelense no corredor!'],

  abudhabi:     ['Comprou tâmaras e perguntou sobre "royalties de petróleo"!','Foi visto com mapa dos Emirados Árabes cobrindo o rosto!','Perguntou como abrir conta bancária sem declarar no Brasil!']

const BAD_CLUES = [
  'Por aqui não. Aqui é bairro sossegado! Nunca vi esse homem.',
  'Não reconheço essa descrição. Acho que você está no lugar errado, detetive!',
  'Esse cara? Jamais apareceu por aqui! Perdeu horas preciosas...',
  'Nada por aqui. Se você tiver informação errada, vai perder tempo demais!',
  'Não! Aqui não tem ninguém assim. Tente outro lugar!'
];

const TRAVEL = {
  brasilia:    {riodejaneiro:2, buenosaires:8, washingtondc:12,dubai:20,israel:22,elsalvador:10,abudhabi:21},
  riodejaneiro:{brasilia:2,    buenosaires:6, washingtondc:13,dubai:20,israel:22,elsalvador:11,abudhabi:21},
  buenosaires: {brasilia:8,    riodejaneiro:6,washingtondc:16,dubai:18,israel:20,elsalvador:14,abudhabi:19},
  washingtondc:{brasilia:12,   riodejaneiro:13,buenosaires:16,dubai:14,israel:12,elsalvador:5, abudhabi:14},
  dubai:       {brasilia:20,   riodejaneiro:20,buenosaires:18,washingtondc:14,israel:4,elsalvador:18,abudhabi:2},
  israel:      {brasilia:22,   riodejaneiro:22,buenosaires:20,washingtondc:12,dubai:4,elsalvador:16,abudhabi:5},
  elsalvador:  {brasilia:10,   riodejaneiro:11,buenosaires:14,washingtondc:5, dubai:18,israel:16,  abudhabi:18},
  abudhabi:    {brasilia:21,   riodejaneiro:21,buenosaires:19,washingtondc:14,dubai:2, israel:5,   elsalvador:18}
};

/* =====================================================
   GAME STATE
   ===================================================== */
const G = { hours:72, city:'brasilia', path:[], step:-1, hideArea:null, explored:[] };

const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const genPath = () => { const c=Object.keys(CITIES).filter(k=>k!=='brasilia'); return shuffle(c).slice(0, 2+Math.floor(Math.random()*2)); };
const targetCity = () => G.path[G.step+1];
const ttime = (a,b) => TRAVEL[a]?.[b] ?? 14;
const hoursStr = () => `⏰ ${G.hours}h restantes`;
const isCorrect = dest => dest === G.path[G.step+1];
const inCorrect = () => G.step>=0 && G.city===G.path[G.step];
const inFinal   = () => G.step===G.path.length-1;

/* =====================================================
   SCENE
   ===================================================== */
class Game extends Phaser.Scene {
  constructor(){ super({key:'Game'}); }

  create(){
    this._reset();
    this._buildAll();
    this._show('title');
  }

  _reset(){
    G.hours=72; G.city='brasilia'; G.step=-1; G.explored=[];
    G.path=genPath();
    G.hideArea=pick(CITIES[G.path[G.path.length-1]].areas).id;
    console.log('PATH:',G.path.join(' → '),'| HIDING:',G.hideArea,'in',G.path[G.path.length-1]);
  }

  /* helpers */
  _show(name){
    Object.values(this.p).forEach(c=>c.setVisible(false));
    this.p[name]?.setVisible(true);
  }
  _bg(c,col=0x050514){ const r=this.add.rectangle(0,0,W,H,col,1).setOrigin(0); c.add(r); return r; }
  _t(c,x,y,s,style){ const t=this.add.text(x,y,s,{fontFamily:'monospace',...style}); if(c)c.add(t); return t; }
  _btn(c,x,y,label,fn,col='#00ff88',sz='18px'){
    const t=this.add.text(x,y,label,{fontFamily:'monospace',fontSize:sz,fill:col}).setOrigin(0.5).setInteractive({useHandCursor:true});
    t.on('pointerover',()=>t.setStyle({fill:'#ffffff'}));
    t.on('pointerout', ()=>t.setStyle({fill:col}));
    t.on('pointerdown',fn);
    if(c)c.add(t);
    return t;
  }

  _buildAll(){
    this.p={};
    this.p.title    = this._bTitle();
    this.p.escape   = this._bEscape();
    this.p.clue     = this._bClue();
    this.p.map      = this._bMap();
    this.p.arrival  = this._bArrival();
    this.p.explore  = this._bExplore();
    this.p.testimony= this._bTestimony();
    this.p.win      = this._bWin();
    this.p.lose     = this._bLose();
    Object.values(this.p).forEach(c=>c.setVisible(false));
  }

  /* ===================== TITLE ===================== */
  _bTitle(){
    const c=this.add.container(0,0);
    this._bg(c,0x050514);
    for(let i=0;i<110;i++){
      const s=this.add.circle(Math.random()*W,Math.random()*H,Math.random()*1.6+0.3,0xffffff,Math.random()*0.8+0.2);
      c.add(s);
      if(Math.random()>0.55) this.tweens.add({targets:s,alpha:0.05,duration:800+Math.random()*2200,yoyo:true,repeat:-1,delay:Math.random()*2000});
    }
    this._t(c,W/2,82,'🌎  ONDE NO MUNDO ESTÁ',{fontSize:'22px',fill:'#55ff99',align:'center'}).setOrigin(0.5);
    const big=this._t(c,W/2,130,'FLÁVIO BOLSONARO?',{fontSize:'38px',fill:'#ffdd00',align:'center',fontStyle:'bold',stroke:'#cc6600',strokeThickness:5}).setOrigin(0.5);
    this.tweens.add({targets:big,y:136,duration:2400,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});
    this._t(c,W/2,190,'O fugitivo mais procurado do Brasil!',{fontSize:'15px',fill:'#9999ff',align:'center'}).setOrigin(0.5);

    const card=this.add.rectangle(W/2,354,680,208,0x0b122a); card.setStrokeStyle(1,0x334488); c.add(card);
    this._t(c,W/2,264,'🕵️  VOCÊ É O DETETIVE XANDÃO',{fontSize:'21px',fill:'#ffffff',align:'center',fontStyle:'bold'}).setOrigin(0.5);
    this._t(c,W/2,308,'Ministro do STF em missão especial!\nFlávio Bolsonaro evadiu o Brasil com mandado\nde prisão ativo. Você tem 72 HORAS para\ncapturá-lo antes que suma para sempre!',{fontSize:'13.5px',fill:'#ccccff',align:'center',lineSpacing:7}).setOrigin(0.5);

    const w=this._t(c,W/2,432,'🔴  PROCURADO PELA JUSTIÇA BRASILEIRA  🔴',{fontSize:'13px',fill:'#ff4444',align:'center'}).setOrigin(0.5);
    this.tweens.add({targets:w,alpha:0.1,duration:700,yoyo:true,repeat:-1});

    const sb=this._btn(c,W/2,504,'[ 🚔  COMEÇAR MISSÃO ]',()=>{ this._reset(); this._doEscape(); },'#00ff88','22px');
    this.tweens.add({targets:sb,scaleX:1.06,scaleY:1.06,duration:1100,yoyo:true,repeat:-1});
    return c;
  }

  /* ===================== ESCAPE ===================== */
  _bEscape(){
    const c=this.add.container(0,0); c.setVisible(false);
    this._bg(c,0x08090f);
    this._t(c,W/2,52,'🚨  ATENÇÃO!  🚨',{fontSize:'28px',fill:'#ff3333',align:'center',fontStyle:'bold'}).setOrigin(0.5);
    this._eDesc=this._t(c,W/2,156,'',{fontSize:'15px',fill:'#eeeeff',align:'center',lineSpacing:9}).setOrigin(0.5);

    const g=this.add.graphics(); g.lineStyle(2,0x222233); g.lineBetween(0,390,W,390);
    for(let x=0;x<W;x+=38){g.lineStyle(1,0x1a2a1a,0.6);g.lineBetween(x,385,x+20,390);} c.add(g);

    this._eFlavio=this._t(c,-80,332,'🏃',{fontSize:'62px'}).setOrigin(0.5);
    this._eMoney =this._t(c,-128,306,'💰',{fontSize:'36px'}).setOrigin(0.5);
    this._eDoc   =this._t(c,-50,318,'📂',{fontSize:'26px'}).setOrigin(0.5);

    this._eBtn=this._btn(c,W/2,488,'[ 📋  VER PISTA ]',()=>{ this._show('clue'); this._upClue(); },'#ffdd00','20px');
    this._eBtn.setAlpha(0);
    c.add([this._eDesc,this._eFlavio,this._eMoney,this._eDoc,this._eBtn]);
    return c;
  }

  _doEscape(){
    this._eDesc.setText(G.step===-1
      ?`Flávio Bolsonaro acabou de fugir do Brasil!\nA Polícia Federal tentou prendê-lo em ${CITIES[G.city].name}\nmas ele escapou com passaportes em punho!\n\nXandão, AGORA É A SUA VEZ! Vá buscá-lo!`
      :`Flávio foi visto saindo de ${CITIES[G.city].name} às pressas!\nEle está sempre um passo à frente...\nMas desta vez não vai escapar!\n\nContinue a perseguição, Xandão!`);
    this._eFlavio.x=-80; this._eMoney.x=-128; this._eDoc.x=-50;
    this._eBtn.setAlpha(0);
    this._show('escape');
    this.tweens.add({targets:[this._eFlavio,this._eMoney,this._eDoc],x:`+=${W+240}`,duration:2800,ease:'Quad.In',
      onComplete:()=>this.tweens.add({targets:this._eBtn,alpha:1,duration:450})});
  }

  /* ===================== CLUE ===================== */
  _bClue(){
    const c=this.add.container(0,0); c.setVisible(false);
    this._bg(c,0x06080f);
    const bdr=this.add.rectangle(W/2,H/2,680,440,0x0c1428); bdr.setStrokeStyle(2,0x1155cc); c.add(bdr);
    this._t(c,W/2,96,'📋',{fontSize:'50px'}).setOrigin(0.5);
    this._t(c,W/2,155,'RELATÓRIO DE INTELIGÊNCIA — STF/BR',{fontSize:'14px',fill:'#3399ff',align:'center'}).setOrigin(0.5);
    const g=this.add.graphics(); g.lineStyle(1,0x1155cc); g.lineBetween(80,180,W-80,180); c.add(g);
    this._cBody=this._t(c,W/2,296,'',{fontSize:'16px',fill:'#e8e8ff',align:'center',wordWrap:{width:580},lineSpacing:11}).setOrigin(0.5);
    this._cTimer=this._t(c,W/2,438,'',{fontSize:'14px',fill:'#ffdd00',align:'center'}).setOrigin(0.5);
    this._btn(c,W/2,492,'[ 🗺️  IR AO MAPA ]',()=>{ this._show('map'); this._upMap(); },'#00ff88','19px');
    c.add([this._cBody,this._cTimer]);
    return c;
  }

  _upClue(){
    const tc=targetCity();
    const clues=DEST_CLUES[tc]||['Pista desconhecida... siga sua intuição!'];
    this._cBody.setText(`Fonte confidencial relatou:\n\n"${pick(clues)}"\n\nUse essa informação para identificar\no próximo destino de Flávio!`);
    this._cTimer.setText(hoursStr());
    this._cTimer.setStyle({fill:G.hours<20?'#ff5555':'#ffdd00'});
  }

  /* ===================== MAP ===================== */
  _bMap(){
    const c=this.add.container(0,0); c.setVisible(false);
    const bg=this.add.rectangle(0,0,W,H,0x07152a).setOrigin(0); c.add(bg);

    const g=this.add.graphics();
    g.lineStyle(1,0x0e2035,0.5);
    for(let x=0;x<W;x+=55)g.lineBetween(x,0,x,H);
    for(let y=0;y<H;y+=50)g.lineBetween(0,y,W,y);

    // North America
    g.fillStyle(0x1c6132,0.9);
    g.fillPoints([{x:78,y:115},{x:234,y:87},{x:274,y:138},{x:284,y:224},{x:244,y:274},{x:200,y:314},{x:164,y:346},{x:142,y:324},{x:96,y:264},{x:74,y:188}],true);
    // Central America
    g.fillPoints([{x:142,y:324},{x:176,y:346},{x:178,y:380},{x:156,y:384},{x:136,y:360}],true);
    // South America
    g.fillStyle(0x207036,0.92);
    g.fillPoints([{x:196,y:314},{x:258,y:302},{x:314,y:308},{x:354,y:346},{x:364,y:398},{x:340,y:454},{x:294,y:470},{x:254,y:468},{x:218,y:432},{x:196,y:378}],true);
    // Europe
    g.fillStyle(0x1c6132,0.85);
    g.fillPoints([{x:426,y:110},{x:524,y:104},{x:550,y:140},{x:544,y:198},{x:500,y:218},{x:454,y:214},{x:428,y:174}],true);
    // Africa
    g.fillStyle(0x1a5e2e,0.88);
    g.fillPoints([{x:436,y:218},{x:542,y:200},{x:574,y:244},{x:580,y:320},{x:558,y:398},{x:512,y:438},{x:462,y:426},{x:432,y:366},{x:418,y:292},{x:428,y:242}],true);
    // Middle East peninsula
    g.fillStyle(0x1c6132,0.72);
    g.fillPoints([{x:510,y:224},{x:600,y:218},{x:626,y:258},{x:618,y:326},{x:580,y:344},{x:536,y:330},{x:514,y:294}],true);
    // Asia
    g.fillStyle(0x1c6132,0.76);
    g.fillPoints([{x:550,y:100},{x:784,y:90},{x:792,y:200},{x:764,y:234},{x:702,y:228},{x:636,y:210},{x:548,y:190},{x:542,y:142}],true);
    // India
    g.fillStyle(0x1c6132,0.82);
    g.fillPoints([{x:612,y:214},{x:690,y:204},{x:726,y:246},{x:708,y:318},{x:654,y:328},{x:618,y:292}],true);
    // SE Asia
    g.fillStyle(0x1c6132,0.68);
    g.fillPoints([{x:698,y:220},{x:782,y:212},{x:792,y:280},{x:758,y:312},{x:698,y:308}],true);
    // Australia
    g.fillStyle(0x1a5e2e,0.74);
    g.fillPoints([{x:676,y:356},{x:772,y:344},{x:792,y:408},{x:758,y:460},{x:686,y:452},{x:654,y:410}],true);
    c.add(g);

    this._t(c,W/2,20,'🌍  MAPA MUNDIAL — CLIQUE EM UMA CIDADE PARA VIAJAR',{fontSize:'12.5px',fill:'#44aaff',align:'center'}).setOrigin(0.5,0);
    this._mTimer=this._t(c,W/2,572,'',{fontSize:'13px',fill:'#ffdd00',align:'center'}).setOrigin(0.5);

    this._dots={}; this._dlbls={};
    for(const[key,city] of Object.entries(CITIES)){
      const dot=this.add.circle(city.mapX,city.mapY,7,0xff8800).setInteractive({useHandCursor:true});
      const lbl=this.add.text(city.mapX,city.mapY-13,city.name,{fontFamily:'monospace',fontSize:'10px',fill:'#eeeeee',stroke:'#000000',strokeThickness:3,align:'center'}).setOrigin(0.5,1).setInteractive({useHandCursor:true});
      const k=key;
      dot.on('pointerover',()=>{ if(k!==G.city){dot.setFillStyle(0xffff44);lbl.setStyle({fill:'#ffff44'});} });
      dot.on('pointerout', ()=>{ if(k!==G.city){dot.setFillStyle(0xff8800);lbl.setStyle({fill:'#eeeeee'});} });
      dot.on('pointerdown',()=>{ if(k!==G.city)this._travel(k); });
      lbl.on('pointerdown',()=>{ if(k!==G.city)this._travel(k); });
      this._dots[key]=dot; this._dlbls[key]=lbl;
      c.add([dot,lbl]);
    }
    this._pmark=this.add.text(0,0,'📍',{fontSize:'18px'}).setOrigin(0.5,1);
    c.add([this._mTimer,this._pmark]);
    return c;
  }

  _upMap(){
    const cur=CITIES[G.city];
    this._pmark.setPosition(cur.mapX+1,cur.mapY-8);
    for(const[k,d] of Object.entries(this._dots)){
      if(k===G.city){
        d.setFillStyle(0x00ff88).setRadius(9).disableInteractive();
        this._dlbls[k].setStyle({fill:'#00ff88'}).disableInteractive();
      } else {
        d.setFillStyle(0xff8800).setRadius(7).setInteractive({useHandCursor:true});
        this._dlbls[k].setStyle({fill:'#eeeeee'}).setInteractive({useHandCursor:true});
      }
    }
    this._mTimer.setText(`${hoursStr()}  —  Clique em uma cidade para viajar`);
    this._mTimer.setStyle({fill:G.hours<20?'#ff5555':'#ffdd00'});
  }

  _travel(dest){
    if(dest===G.city)return;
    const t=ttime(G.city,dest);
    G.hours-=t; G.city=dest; G.explored=[];
    if(isCorrect(dest)) G.step++;
    if(G.hours<=0){G.hours=0;this._doLose();return;}
    this._show('arrival'); this._upArrival(dest,t);
  }

  /* ===================== ARRIVAL ===================== */
  _bArrival(){
    const c=this.add.container(0,0); c.setVisible(false);
    this._bg(c,0x0c1520);
    this._aEmoji  =this._t(c,W/2,94,'',{fontSize:'62px'}).setOrigin(0.5);
    this._aName   =this._t(c,W/2,175,'',{fontSize:'30px',fill:'#ffdd00',align:'center',fontStyle:'bold'}).setOrigin(0.5);
    this._aCountry=this._t(c,W/2,217,'',{fontSize:'16px',fill:'#9999ff',align:'center'}).setOrigin(0.5);
    this._aTravel =this._t(c,W/2,253,'',{fontSize:'13px',fill:'#ff8844',align:'center'}).setOrigin(0.5);
    const g=this.add.graphics(); g.lineStyle(1,0x336699); g.lineBetween(80,278,W-80,278); c.add(g);
    this._t(c,W/2,294,'📚  FATO INTERESSANTE:',{fontSize:'12px',fill:'#4499ff',align:'center'}).setOrigin(0.5);
    this._aFact  =this._t(c,W/2,364,'',{fontSize:'13.5px',fill:'#dde8ff',align:'center',wordWrap:{width:640},lineSpacing:8}).setOrigin(0.5);
    this._aTimer =this._t(c,W/2,460,'',{fontSize:'14px',fill:'#ffdd00',align:'center'}).setOrigin(0.5);
    this._btn(c,W/2,511,'[ 🏛️  INVESTIGAR LOCAIS ]',()=>{ this._show('explore'); this._upExplore(); },'#00ff88','20px');
    c.add([this._aEmoji,this._aName,this._aCountry,this._aTravel,this._aFact,this._aTimer]);
    return c;
  }

  _upArrival(dest,tt){
    const city=CITIES[dest];
    this._aEmoji.setText(city.emoji); this._aName.setText(city.name);
    this._aCountry.setText(`📍 ${city.country}`);
    this._aTravel.setText(`✈️  Viagem: ${tt} horas`);
    this._aFact.setText(city.fact);
    this._aTimer.setText(hoursStr());
    this._aTimer.setStyle({fill:G.hours<20?'#ff5555':'#ffdd00'});
  }

  /* ===================== EXPLORE ===================== */
  _bExplore(){
    const c=this.add.container(0,0); c.setVisible(false);
    this._bg(c,0x0c1a0c);
    this._exTitle =this._t(c,W/2,32,'',{fontSize:'18px',fill:'#44ff88',align:'center',fontStyle:'bold'}).setOrigin(0.5);
    this._exSub   =this._t(c,W/2,63,'Cada visita custa 1 hora. Fale com as testemunhas!',{fontSize:'12.5px',fill:'#666666',align:'center'}).setOrigin(0.5);
    this._exTimer =this._t(c,W/2,93,'',{fontSize:'13.5px',fill:'#ffdd00',align:'center'}).setOrigin(0.5);

    this._areaRows=[];
    for(let i=0;i<3;i++){
      const y=183+i*124;
      const box=this.add.rectangle(W/2,y,676,108,0x112811).setStrokeStyle(1,0x225522).setInteractive({useHandCursor:true});
      const ico =this._t(c,90,y,'',{fontSize:'34px'}).setOrigin(0.5);
      const nm  =this._t(c,128,y-16,'',{fontSize:'17px',fill:'#ffffff',fontStyle:'bold'});
      const wit =this._t(c,128,y+14,'',{fontSize:'12px',fill:'#888888'});
      const vis =this._t(c,W-68,y,'✓ Visitado',{fontSize:'12px',fill:'#33aa44',align:'center'}).setOrigin(0.5).setVisible(false);
      const ii=i;
      box.on('pointerover',()=>{ if(!this._wasExp(ii))box.setFillStyle(0x1a3a1a); });
      box.on('pointerout', ()=>{ if(!this._wasExp(ii))box.setFillStyle(0x112811); });
      box.on('pointerdown',()=>this._doExplore(ii));
      c.add([box,ico,nm,wit,vis]);
      this._areaRows.push({box,ico,nm,wit,vis});
    }

    this._exMapBtn =this._btn(c,W/2-160,550,'[ 🗺️  TENTAR OUTRA CIDADE ]',()=>{ this._show('map'); this._upMap(); },'#9988ff','14px');
    this._exMapBtn.setVisible(false);
    this._exNextBtn=this._btn(c,W/2+148,550,'[ ▶  PRÓXIMA PISTA ]',()=>this._doEscape(),'#00ffaa','14px');
    this._exNextBtn.setVisible(false);

    c.add([this._exTitle,this._exSub,this._exTimer,this._exMapBtn,this._exNextBtn]);
    return c;
  }

  _wasExp(i){ return G.explored.includes(CITIES[G.city].areas[i].id); }

  _upExplore(){
    const city=CITIES[G.city];
    this._exTitle.setText(`📍  ${city.name} — O que investigar?`);
    this._exTimer.setText(hoursStr());
    this._exTimer.setStyle({fill:G.hours<20?'#ff5555':'#ffdd00'});
    for(let i=0;i<3;i++){
      const a=city.areas[i]; const r=this._areaRows[i];
      r.ico.setText(a.icon); r.nm.setText(a.name); r.wit.setText(`Testemunha: ${a.witness}`);
      r.vis.setVisible(false); r.box.setFillStyle(0x112811).setInteractive({useHandCursor:true});
    }
    this._exMapBtn.setVisible(false); this._exNextBtn.setVisible(false);
  }

  _refreshExpBtns(){
    this._exTimer.setText(hoursStr());
    this._exTimer.setStyle({fill:G.hours<20?'#ff5555':'#ffdd00'});
    const cor=inCorrect(), fin=inFinal();
    if(!cor&&!fin){ if(G.explored.length>0)this._exMapBtn.setVisible(true); }
    else if(cor&&!fin){ this._exMapBtn.setVisible(true); if(G.explored.length>0)this._exNextBtn.setVisible(true); }
  }

  _doExplore(i){
    if(this._wasExp(i))return;
    G.hours-=1;
    const area=CITIES[G.city].areas[i];
    G.explored.push(area.id);
    const r=this._areaRows[i];
    r.vis.setVisible(true); r.box.setFillStyle(0x0a180a).disableInteractive();
    if(G.hours<=0){G.hours=0;this._doLose();return;}

    const cor=inCorrect(), fin=inFinal();
    let test;

    if(!cor&&!fin){
      test={type:'wrong',witness:area.witness,area:area.name,text:pick(BAD_CLUES)};
    } else if(cor&&!fin){
      const nc=targetCity();
      const cl=DEST_CLUES[nc]||['Ouvi que ele foi muito longe daqui!'];
      test={type:'mid',witness:area.witness,area:area.name,text:pick(cl)};
    } else {
      if(area.id===G.hideArea){
        test={type:'found',witness:area.witness,area:area.name,
          text:'🚨 É ELE! FLÁVIO ESTÁ AQUI!\n\n"Não! Não! Sou inocente!\nIsso é perseguição política!\nTenho imunidade! Tenho amigos!\nAAAAH!"\n\nXANDÃO, PRENDA-O AGORA!'};
      } else {
        const ha=CITIES[G.city].areas.find(a=>a.id===G.hideArea);
        test={type:'miss',witness:area.witness,area:area.name,
          text:`Aqui não tem ninguém suspeito...\nMas ouvi barulho estranho lá no(a)\n"${ha?.name}"!\nParecia alguém tentando se esconder!`};
      }
    }
    this._show('testimony'); this._upTest(test);
  }

  /* ===================== TESTIMONY ===================== */
  _bTestimony(){
    const c=this.add.container(0,0); c.setVisible(false);
    this._bg(c,0x0e0c1e);
    const bdr=this.add.rectangle(W/2,300,720,542,0x110e28); bdr.setStrokeStyle(2,0x2233aa); c.add(bdr);
    this._tArea   =this._t(c,W/2,50,'',{fontSize:'12.5px',fill:'#666699',align:'center'}).setOrigin(0.5);
    this._tWit    =this._t(c,W/2,85,'',{fontSize:'20px',fill:'#ffdd00',align:'center',fontStyle:'bold'}).setOrigin(0.5);
    this._tIcon   =this._t(c,W/2,142,'💬',{fontSize:'44px'}).setOrigin(0.5);
    this._tText   =this._t(c,W/2,290,'',{fontSize:'16px',fill:'#e8e8ff',align:'center',wordWrap:{width:622},lineSpacing:12}).setOrigin(0.5);
    this._tTimer  =this._t(c,W/2,454,'',{fontSize:'13.5px',fill:'#ffdd00',align:'center'}).setOrigin(0.5);

    this._tBack =this._btn(c,W/2-215,515,'[ ← EXPLORAR MAIS ]',()=>{ this._show('explore'); this._refreshExpBtns(); },'#aaaaff','14px');
    this._tMap  =this._btn(c,W/2-10, 515,'[ 🗺️ MUDAR CIDADE ]', ()=>{ this._show('map'); this._upMap(); },'#9988ff','14px');
    this._tNext =this._btn(c,W/2+185,515,'[ ▶ PRÓXIMA PISTA ]', ()=>this._doEscape(),'#00ffaa','14px');
    this._tWin  =this._btn(c,W/2,    515,'[ 🚔 PRENDER FLÁVIO! ]',()=>this._doWin(),'#ff3333','23px');

    c.add([this._tArea,this._tWit,this._tIcon,this._tText,this._tTimer,this._tBack,this._tMap,this._tNext,this._tWin]);
    return c;
  }

  _upTest(d){
    this._tArea.setText(`📍 Local: ${d.area}`);
    this._tWit.setText(`👤 ${d.witness} diz:`);
    this._tTimer.setText(hoursStr());
    this._tTimer.setStyle({fill:G.hours<20?'#ff5555':'#ffdd00'});
    const icons={wrong:'😕',mid:'🔍',miss:'🤔',found:'🚨'};
    this._tIcon.setText(icons[d.type]||'💬');
    this._tText.setText(d.text);
    this._tBack.setVisible(false); this._tMap.setVisible(false);
    this._tNext.setVisible(false); this._tWin.setVisible(false);
    if(d.type==='found')       { this._tWin.setVisible(true); }
    else if(d.type==='wrong')  { this._tBack.setVisible(true); this._tMap.setVisible(true); }
    else if(d.type==='mid')    { this._tBack.setVisible(true); this._tNext.setVisible(true); }
    else if(d.type==='miss')   { this._tBack.setVisible(true); }
  }

  /* ===================== WIN ===================== */
  _bWin(){
    const c=this.add.container(0,0); c.setVisible(false);
    this._bg(c,0x001308);
    for(let i=0;i<55;i++){
      const conf=this.add.rectangle(Math.random()*W,Math.random()*H*0.6,7,14,
        [0xffdd00,0x00ff88,0xff4444,0x4488ff,0xff8800][Math.floor(Math.random()*5)]);
      c.add(conf);
      this.tweens.add({targets:conf,y:H+30,rotation:Math.PI*(4+Math.random()*4),
        duration:2500+Math.random()*2500,repeat:-1,delay:Math.random()*2500});
    }
    const big=this._t(c,W/2,70,'🎉 PARABÉNS, XANDÃO! 🎉',{fontSize:'30px',fill:'#ffdd00',align:'center',fontStyle:'bold',stroke:'#cc6600',strokeThickness:4}).setOrigin(0.5);
    this.tweens.add({targets:big,y:76,duration:1800,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});
    this._t(c,W/2,134,'🚔  FLÁVIO BOLSONARO FOI PRESO!  🚔',{fontSize:'20px',fill:'#00ff88',align:'center',fontStyle:'bold'}).setOrigin(0.5);
    this._t(c,W/2,215,'🏃💨 → 🔒⛓️',{fontSize:'60px'}).setOrigin(0.5);
    this._t(c,W/2,306,'"Não pode! Tenho imunidade!\nEu tenho amigos no governo! AAAAAAH!"',{fontSize:'15px',fill:'#ff8888',align:'center',fontStyle:'italic',lineSpacing:8}).setOrigin(0.5);
    this._t(c,W/2,374,'Flávio Bolsonaro foi capturado e extraditado\npara responder por corrupção na Justiça Brasileira!',{fontSize:'14px',fill:'#aaffaa',align:'center',lineSpacing:8}).setOrigin(0.5);
    this._wTime=this._t(c,W/2,440,'',{fontSize:'16px',fill:'#ffdd00',align:'center'}).setOrigin(0.5);
    this._btn(c,W/2,516,'[ 🔄  JOGAR NOVAMENTE ]',()=>{ this._reset(); this._show('title'); },'#00ff88','20px');
    c.add([this._wTime]);
    return c;
  }

  _doWin(){ this._show('win'); this._wTime.setText(hoursStr()); }

  /* ===================== LOSE ===================== */
  _bLose(){
    const c=this.add.container(0,0); c.setVisible(false);
    this._bg(c,0x180808);

    const big=this._t(c,W/2,75,'😤  E O LULA...  😤',{fontSize:'34px',fill:'#ff3333',align:'center',fontStyle:'bold',stroke:'#800000',strokeThickness:4}).setOrigin(0.5);
    this.tweens.add({targets:big,scaleX:1.05,scaleY:1.05,duration:600,yoyo:true,repeat:-1});
    this._t(c,W/2,143,'GAME OVER',{fontSize:'48px',fill:'#ff0000',align:'center',fontStyle:'bold'}).setOrigin(0.5);
    this._t(c,W/2,222,'🍫😂🍫',{fontSize:'64px'}).setOrigin(0.5);
    this._t(c,W/2,304,'"Hahaha! Não me pegaram!\nVou tomar chocolate aqui enquanto\no Brasil pega fogo!"',{fontSize:'16px',fill:'#ff8888',align:'center',fontStyle:'italic',lineSpacing:8}).setOrigin(0.5);

    const inv=this._t(c,W/2,392,'🦅🇺🇸  OS EUA ESTÃO INVADINDO O BRASIL!  🇺🇸🦅',{fontSize:'14px',fill:'#ff6600',align:'center',fontStyle:'bold'}).setOrigin(0.5);
    this.tweens.add({targets:inv,alpha:0.15,duration:500,yoyo:true,repeat:-1});

    this._t(c,W/2,444,'Sem o Detetive Xandão para encontrar Flávio,\na situação ficou ainda mais caótica...',{fontSize:'14px',fill:'#ffaaaa',align:'center',lineSpacing:8}).setOrigin(0.5);

    this._btn(c,W/2,518,'[ 🔄  TENTAR NOVAMENTE ]',()=>{ this._reset(); this._show('title'); },'#ff6644','20px');
    return c;
  }

  _doLose(){ this._show('lose'); }
}

/* =====================================================
   BOOT
   ===================================================== */
new Phaser.Game({
  type: Phaser.AUTO,
  width: W,
  height: H,
  backgroundColor: '#050514',
  scene: [Game],
  parent: document.body,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  }
});
</script>
